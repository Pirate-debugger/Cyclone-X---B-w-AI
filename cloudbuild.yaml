steps:
  # 1. Build Backend Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclonex-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclonex-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # 2. Build Frontend Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclonex-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cyclonex-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # 3. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cyclonex-backend:$COMMIT_SHA']

  # 4. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cyclonex-frontend:$COMMIT_SHA']

  # 5. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cyclonex-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cyclonex-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'APP_MODE=production,GEMINI_MODEL=gemini-3.8-flash,VERTEX_AI_LOCATION=us-central1'

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cyclonex-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cyclonex-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/cyclonex-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/cyclonex-frontend:$COMMIT_SHA'
