version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cyclonex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyclonex_db
      POSTGRES_USER: cyclonex
      POSTGRES_PASSWORD: cyclonex_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclonex -d cyclonex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyclonex_backend
    restart: unless-stopped
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: postgresql://cyclonex:cyclonex_secret@db:5432/cyclonex_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_AI_PROJECT: ${VERTEX_AI_PROJECT:-}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-us-central1}
      VERTEX_IMPACT_ENDPOINT: ${VERTEX_IMPACT_ENDPOINT:-}
      EARTH_ENGINE_PROJECT: ${EARTH_ENGINE_PROJECT:-}
      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT:-}
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-cyclonex_analytics}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_WEATHER_API_ENABLED: ${GOOGLE_WEATHER_API_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyclonex_frontend
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
